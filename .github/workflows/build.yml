name: Bangun aplikasi

# Berjalan otomatis setiap ada perubahan di cabang main, atau manual dari tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bangun-aplikasi
  cancel-in-progress: false

jobs:
  web:
    name: Versi web (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          APP_BUILD: ${{ github.run_number }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret KEYSTORE_BASE64 dan KEYSTORE_PASSWORD belum diisi. Lihat README, bagian 'Kunci tanda tangan APK'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          APP_BUILD: ${{ github.run_number }}
      - name: Arahkan APK ke versi web terbaru
        run: node scripts/live-config.mjs
      - run: npx cap add android
      - run: npm run android:prepare
      - name: Bangun APK
        working-directory: android
        env:
          APP_BUILD: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk "Finance-1.0.${{ github.run_number }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Finance 1.0.${{ github.run_number }}
          make_latest: true
          files: Finance-1.0.${{ github.run_number }}.apk
          body: |
            Unduh file **Finance-1.0.${{ github.run_number }}.apk** di bawah ini lalu buka di HP Android.
            Kalau aplikasi versi lama sudah terpasang, pasang saja di atasnya. Datamu tetap aman.
